<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Anime Studio</title>
<style>
:root{--bg:#eef0f5;--ink:#1c1b2e;--sub:#6b6a80;--card:#fff;--acc:#d6245f;--line:#d9dbe6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans CJK JP",sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:1fr 280px;gap:28px;align-items:start}
@media(max-width:720px){main{grid-template-columns:1fr}.phone{max-width:260px;margin:0 auto}}
h1{font-size:28px;margin:0 0 2px}.lead{color:var(--sub);margin:0 0 8px}
.t{display:block;font-weight:700;margin:18px 0 6px}
textarea{width:100%;min-height:150px;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card);resize:vertical}
textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.seg{display:flex;gap:8px}.seg label{flex:1}.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.seg input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.go{margin-top:20px;width:100%;padding:15px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:700 17px inherit;cursor:pointer}
.go:disabled{opacity:.5}
.ghost{padding:11px 18px;border-radius:10px;border:1.5px solid var(--ink);background:none;font:inherit;cursor:pointer}
.phone{position:sticky;top:16px;aspect-ratio:9/16;background:#14131f;border-radius:28px;padding:10px}
.screen{height:100%;border-radius:20px;background:#2a2940;color:#bbb;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;overflow:hidden}
.screen video{width:100%;height:100%;object-fit:cover;border-radius:20px}
.bar{height:10px;background:#d4d6e2;border-radius:5px;overflow:hidden;margin:14px 0 8px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.dots{display:flex;gap:6px}.dots b{flex:1;height:8px;border-radius:4px;background:#d4d6e2}.dots b.on{background:var(--ink)}
.msg{margin:8px 0;color:var(--sub)}.err{color:#b00020;font-weight:700}.warn{color:#8a5a00}
details{margin-top:14px;background:var(--card);border-radius:10px;padding:10px 14px}
</style></head><body><main>
<section>
<h1>AI Anime Studio</h1>
<p class="lead">物語を書くと、縦型の2Dアニメ動画（MP4）ができます。<br>デモ版：無料・API不使用</p>
<label class="t" for="story">ストーリー</label>
<textarea id="story" placeholder="例：猫のミケは魔法の森で迷子になった。光るキノコの道をたどると、小さな魔女と出会う。二人は星の欠片を探す旅に出た。"></textarea>
<span class="t">動画の長さ（6シーン）</span>
<div class="seg">
<label><input type="radio" name="d" value="30"><span>30秒<br><small>5秒×6</small></span></label>
<label><input type="radio" name="d" value="60" checked><span>60秒<br><small>10秒×6</small></span></label>
<label><input type="radio" name="d" value="120"><span>120秒<br><small>20秒×6</small></span></label></div>
<button class="go" id="go">動画を作る</button>
<div class="bar" id="barw"><i id="bar"></i></div>
<div class="dots" id="dots"></div>
<p class="msg" id="msg"></p>
<details id="sc" hidden><summary>台本を見る</summary><div id="scbody"></div></details>
</section>
<aside><div class="phone"><div class="screen" id="screen">ここに動画が表示されます</div></div>
<p style="text-align:center"><a id="dl" hidden><button class="ghost">MP4を保存</button></a></p></aside>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function msg(t,c){$('msg').textContent=t;$('msg').className='msg '+(c||'')}
function dots(n){$('dots').innerHTML=Array.from({length:6},(_,i)=>`<b class="${i<n?'on':''}"></b>`).join('')}
$('go').onclick=async()=>{
 const story=$('story').value.trim(); if(!story)return msg('ストーリーを入力してください','err');
 $('go').disabled=true;$('dl').hidden=true;$('sc').hidden=true;$('barw').style.display='block';$('bar').style.width='0';dots(0);msg('');
 $('screen').textContent='作成中…';
 const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({story,duration:+document.querySelector('[name=d]:checked').value})}).then(x=>x.json());
 if(r.error){$('go').disabled=false;$('barw').style.display='none';return msg(r.error,'err')}
 const t=setInterval(async()=>{
  const s=await fetch('/api/status/'+r.id).then(x=>x.json());
  $('bar').style.width=(s.progress||0)+'%';dots(s.scenes_done||0);msg(s.message||'');
  if(s.script&&$('sc').hidden){$('sc').hidden=false;$('scbody').innerHTML=s.script.scenes.map((x,i)=>`<p>${i+1}. ${esc(x.narration)}</p>`).join('')}
  if(s.status==='error'){clearInterval(t);$('go').disabled=false;msg(s.error,'err')}
  if(s.status==='done'){clearInterval(t);$('go').disabled=false;
   msg((s.warnings||[]).join(' ')||'完成しました！',s.warnings&&s.warnings.length?'warn':'');
   $('screen').innerHTML=`<video src="/api/video/${r.id}" controls autoplay loop playsinline></video>`;
   $('dl').href=`/api/video/${r.id}?dl=1`;$('dl').hidden=false}
 },1500)};
</script></body></html>
